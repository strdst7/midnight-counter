# Local Midnight devnet for midnight-counter
# LOCAL DEVELOPMENT ONLY — do not expose these ports to a public network.
# Tear down with: docker compose down -v
name: midnight-counter-devnet

services:
  node:
    image: midnightntwrk/midnight-node:0.22.5
    container_name: midnight-counter-node
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexer:
    # Pinned to 4.2.1, NOT 4.3.0+: indexer-standalone 4.3.0 introduced an SPO
    # (Cardano Stake Pool Operator) indexer that hard-requires a Blockfrost API
    # key (APP__INFRA__SPO_NODE__BLOCKFROST_ID) — the process exits 1 at boot
    # if missing, and placeholder values are explicitly rejected. There is no
    # opt-out flag. 4.2.1 is the latest tag without that dependency, so it is
    # the latest viable image for a zero-config local devnet. Do not bump to
    # 4.3.x without first wiring a Blockfrost credential into this compose file
    # — that is unacceptable for a "first DApp on Midnight" experience.
    image: midnightntwrk/indexer-standalone:4.2.1
    container_name: midnight-counter-indexer
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      APP__INFRA__NODE__URL: "ws://node:9944"
      APP__INFRA__STORAGE__PASSWORD: "indexer"
      APP__INFRA__PUB_SUB__PASSWORD: "indexer"
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: "indexer"
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    # NOT distroless. Earlier comments here claimed it was, because `ls` fails
    # inside: /bin actually holds bash, sh and coreutils, but PATH contains only
    # the ledger nix store, so every command looks missing. What is genuinely
    # absent is an HTTP client (no curl/wget/nc) — and the entrypoint is
    # `bash -c`, which is all a /dev/tcp healthcheck needs.
    # Pinned to 8.0.3, NOT a 7.x: proof-server 7.x (7.0.0 through 7.0.3 tested)
    # hangs after receiving /prove on Apple Silicon + Docker Desktop — the
    # worker thread spins at 100% CPU with no log output and no progress, while
    # the same digest works on x86_64 Linux. Upstream traced the 6.x/7.x arm64
    # images to cross-compilation and moved to native arm64 builds from
    # 8.0.0-rc.4: https://github.com/midnightntwrk/midnight-ledger/issues/135
    # Never bump downward into the 7.x line without re-testing on macOS arm64.
    image: midnightntwrk/proof-server:8.0.3
    container_name: midnight-counter-proof-server
    command: ["midnight-proof-server -v"]
    ports:
      - "6300:6300"
    environment:
      RUST_BACKTRACE: "full"

    healthcheck:
      # /dev/tcp is a bash builtin: no binary, no PATH entry, no packages. It
      # exits 0 only when the socket actually connects. Without this block
      # `docker compose up -d --wait` returns in ~2s, long before the server
      # accepts connections, and any deploy that trusts --wait races it.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6300"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
